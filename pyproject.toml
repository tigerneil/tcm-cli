[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tcm-cli"
version = "0.2.0"
description = "Multimodal TCM Studio & autonomous agent for Traditional Chinese Medicine research and clinical application"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [
    { name = "TCM-CLI Contributors" },
]
keywords = [
    "tcm",
    "traditional-chinese-medicine",
    "multimodal",
    "tcm-studio",
    "tongue-diagnosis",
    "herbs",
    "acupuncture",
    "pharmacology",
    "network-pharmacology",
    "bioinformatics",
    "ai-agent",
    "llm",
    "research",
    "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "anthropic>=0.40",
    "openai>=1.0",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-dotenv>=1.0",
    "markdown>=3.5",
]

[project.urls]
Homepage = "https://tigerneil.github.io/tcm-cli/"
Repository = "https://github.com/tigerneil/tcm-cli"
Documentation = "https://github.com/tigerneil/tcm-cli/tree/main/docs"
"Bug Tracker" = "https://github.com/tigerneil/tcm-cli/issues"

[project.optional-dependencies]
vision = [
    "pillow>=10.0",
]
chemistry = [
    "rdkit>=2023.03",
]
ml = [
    "torch>=2.0",
    "transformers>=4.40",
]
analysis = [
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]
all = [
    "pillow>=10.0",
    "rdkit>=2023.03",
    "torch>=2.0",
    "transformers>=4.40",
    "seaborn>=0.13",
    "scikit-learn>=1.3",
    "scipy>=1.10",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
tcm = "tcm.cli:entry"

[tool.hatch.build.targets.wheel]
packages = ["src/tcm"]

[tool.hatch.build.targets.wheel.force-include]
"docs/index.html" = "tcm/studio/static/index.html"
"docs/styles.css" = "tcm/studio/static/styles.css"
"docs/script.js" = "tcm/studio/static/script.js"
"docs/studio.html" = "tcm/studio/static/studio.html"
"docs/studio.css" = "tcm/studio/static/studio.css"
"docs/studio.js" = "tcm/studio/static/studio.js"
"docs/assets" = "tcm/studio/static/assets"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: end-to-end tests hitting real APIs",
]
